<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eceae4" />
    <meta name="description" content="HapticEV — find, book and pay for EV charging slots in seconds. Live availability, AI dynamic pricing and 24/7 roadside help." />
    <title>HapticEV — Charge Without the Wait</title>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      (function () {
        try {
          var t = localStorage.getItem('hev_theme');
          document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
